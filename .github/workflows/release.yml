name: Release

# A tag v* on main checks the bot and pushes its Docker image to GHCR (BOT-07, docs/ARCHITECTURE.md "Hosting");
# TrueNAS pulls it (web repo deploy/README.md). Pushing a tag deploys: only on Nico's go-ahead (CLAUDE.md "Releases").
# Run by hand to rebuild an existing tag, e.g. after a base image fix.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild and push (e.g. v1.0.0)
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nicoputten/communitiesforever-discord
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      # Tags can't be filtered by branch in `on:`, so check that the tagged commit is on main.
      - name: Tag is on main
        run: |
          [[ "$TAG" == v* ]] || { echo "::error::$TAG is not a v* tag"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      # CLAUDE.md "Releases": the release renames "## Unreleased" to "## <tag> (<date>)".
      - name: CHANGELOG has the tag
        run: grep -qE "^## ${TAG//./\\.}( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: APP_VERSION=${{ env.TAG }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
