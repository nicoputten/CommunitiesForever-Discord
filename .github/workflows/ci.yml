name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  # CLAUDE.md rule 1: no secrets in any commit of the push or PR, history included.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
